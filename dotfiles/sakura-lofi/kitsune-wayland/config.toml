# ============================================================================
# 🦊 Kitsune Go Wayland — Configuración Principal del Escritorio Anime
# Tema activo : Sakura Catppuccin (桜ローファイ // 宵) — Pétalos de cerezo animados y paleta Catppuccin Mocha
# Modo        : TABBED (Sin Dock inferior • Barra superior Waybar + Rofi)
# ============================================================================

[engine]
name = "Kitsune Go Wayland"
listen_addr = "127.0.0.1:18080"
wayland_backend = "cage-ozone-wayland"
dock_enabled = false
top_bar = "waybar-kitsune"
launcher = "rofi-kitsune"

[theme]
id = "sakura-lofi"
name = "Sakura Catppuccin"
japanese_name = "桜ローファイ // 宵"
wallpaper = "~/.config/kitsune-de/wallpapers/sakura-lofi.jpg"
particle_mode = "sakura"
particles_enabled = true
animations_enabled = true

[colors]
primary = "#f5c2e7"
secondary = "#cba6f7"
accent = "#fab387"
bg_base = "#181825"
bg_surface = "#1e1e2e"
bg_overlay = "#313244"
text_main = "#cdd6f4"
text_muted = "#9399b2"

[windows]
default_layout = "tabbed"
workspaces = ["一", "二", "三", "四", "五"]
gaps_in = 8
gaps_out = 12
border_size = 2
border_radius = 12
window_opacity = 92

[effects]
blur_enabled = true
blur_radius = 18
border_glow = true
glow_intensity = 72

[apps]
rice_studio = "kitsune-ctl open settings"
btop_monitor = "kitsune-ctl open sysmon"
yazi_files = "kitsune-ctl open files"
neovim_go_studio = "kitsune-ctl open nvim"
terminal = "kitsune-ctl open terminal"

[keybindings]
"Alt+Space" = "launcher:rofi"
"Alt+Return" = "app:terminal"
"Alt+W" = "layout:tabbed"
"Alt+T" = "layout:toggle"
"Alt+V" = "window:toggle_floating"
"Alt+Q" = "window:close"
"Alt+Tab" = "tab:next"
"Alt+1..5" = "workspace:switch"
