# ── Efectos Exclusivos de SwayFX ( Anime Eye-Candy ) ─────────────────────────
corner_radius 12
smart_corner_radius off

blur enable
blur_xray disable
blur_passes 3
blur_radius 6
blur_noise 0.02
blur_brightness 0.95
blur_contrast 1.05
blur_saturation 1.15

shadows enable
shadows_on_csd enable
shadow_blur_radius 22
shadow_color #00f0ff66
shadow_inactive_color #0b091688

default_dim_inactive 0.10
dim_inactive_colors.unfocused #0b0916AA
dim_inactive_colors.urgent #ff2a6dAA

layer_effects "waybar" "blur enable; shadows enable; corner_radius 12"
layer_effects "rofi" "blur enable; shadows enable; corner_radius 12"
layer_effects "notifications" "blur enable; corner_radius 12"
