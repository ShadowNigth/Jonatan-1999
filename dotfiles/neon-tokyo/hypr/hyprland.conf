# ============================================================================
# KitsuneDE // Generado automáticamente en Go
# Tema Anime: Cyberpunk Neon Tokyo (ネオ東京 // 2099)
# ============================================================================

monitor=,preferred,auto,1

exec-once = waybar
exec-once = swww-daemon && swww img ~/.config/kitsune-de/wallpapers/neon-tokyo.jpg --transition-type grow --transition-fps 60
exec-once = kitsune-de --daemon

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct

input {
    kb_layout = latam,us
    follow_mouse = 1
    sensitivity = 0
}

general {
    gaps_in = 8
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(00f0ffee) rgba(ff2a85ee) 45deg
    col.inactive_border = rgba(13102688)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 12
    active_opacity = 0.90
    inactive_opacity = 0.86

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        vibrancy = 0.22
    }

    shadow {
        enabled = true
        range = 22
        render_power = 3
        color = rgba(00f0ff66)
    }
}

animations {
    enabled = yes
    bezier = kitsuneCurve, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 6, kitsuneCurve
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 45, default, loop
    animation = fade, 1, 6, default
    animation = workspaces, 1, 5, kitsuneCurve, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

$mainMod = SUPER

bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, kitty -e yazi
bind = $mainMod, V, togglefloating,
bind = $mainMod, Space, exec, rofi -show drun
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, T, exec, kitsune-ctl theme next
bind = $mainMod, D, exec, kitsune-de --kiosk

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
