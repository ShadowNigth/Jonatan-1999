# ============================================================================
# 🦊 Kitsune Go Wayland — Configuración Principal del Escritorio Anime
# Tema activo : Cyberpunk Neon Tokyo (ネオ東京 // 2099) — Lluvia nocturna neón cian y magenta
# Modo        : TABBED (Sin Dock inferior • Barra superior Waybar + Rofi)
# ============================================================================

[engine]
name = "Kitsune Go Wayland"
listen_addr = "127.0.0.1:18080"
wayland_backend = "cage-ozone-wayland"
dock_enabled = false
top_bar = "waybar-kitsune"
launcher = "rofi-kitsune"

[theme]
id = "neon-tokyo"
name = "Cyberpunk Neon Tokyo"
japanese_name = "ネオ東京 // 2099"
wallpaper = "~/.config/kitsune-de/wallpapers/neon-tokyo.jpg"
particle_mode = "rain"
particles_enabled = true
animations_enabled = true

[colors]
primary = "#00f0ff"
secondary = "#ff2a85"
accent = "#bd00ff"
bg_base = "#0b0916"
bg_surface = "#131026"
bg_overlay = "#1e1938"
text_main = "#eef6ff"
text_muted = "#8f9bb8"

[windows]
default_layout = "tabbed"
workspaces = ["一", "二", "三", "四", "五"]
gaps_in = 8
gaps_out = 12
border_size = 2
border_radius = 12
window_opacity = 92

[effects]
blur_enabled = true
blur_radius = 18
border_glow = true
glow_intensity = 72

[apps]
rice_studio = "kitsune-ctl open settings"
btop_monitor = "kitsune-ctl open sysmon"
yazi_files = "kitsune-ctl open files"
neovim_go_studio = "kitsune-ctl open nvim"
terminal = "kitsune-ctl open terminal"

[keybindings]
"Alt+Space" = "launcher:rofi"
"Alt+Return" = "app:terminal"
"Alt+W" = "layout:tabbed"
"Alt+T" = "layout:toggle"
"Alt+V" = "window:toggle_floating"
"Alt+Q" = "window:close"
"Alt+Tab" = "tab:next"
"Alt+1..5" = "workspace:switch"
