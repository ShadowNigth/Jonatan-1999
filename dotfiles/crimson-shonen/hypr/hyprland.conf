# ============================================================================
# KitsuneDE // Hyprland Config Con Animaciones Fluidas — Crimson Shonen (紅蓮の刃 // 月蝕)
# ============================================================================

monitor=,preferred,auto,1
exec-once = waybar
exec-once = ~/.config/sway/start-dock.sh
exec-once = swww-daemon && swww img ~/.config/kitsune-de/wallpapers/crimson-shonen.jpg --transition-type grow --transition-fps 60
exec-once = swaync
exec-once = kitsune-de --addr 127.0.0.1:8080 --compositor hyprland

general {
    gaps_in = 8
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(ff1e42ee) rgba(ff7b54ee) 45deg
    col.inactive_border = rgba(13111888)
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 0.90
    inactive_opacity = 0.88
    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.22
    }
}

animations {
    enabled = yes
    bezier = kitsuneCurve, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 6, kitsuneCurve
    animation = borderangle, 1, 45, default, loop
    animation = workspaces, 1, 5, kitsuneCurve, slide
}

$mainMod = SUPER
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod, Space, exec, rofi -show drun
bind = $mainMod, V, togglefloating,
bind = $mainMod, T, exec, kitsune-ctl theme next
bind = $mainMod, L, exec, swaylock -f -C ~/.config/swaylock/config
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
