# ============================================================================
# KitsuneDE // Hyprland Config (Perfil Alternativo) — Midnight Evangelion (第3新東京市 // NERV)
# ============================================================================

monitor=,preferred,auto,1
exec-once = waybar
exec-once = swww-daemon && swww img ~/.config/kitsune-de/wallpapers/eva-midnight.jpg --transition-type grow --transition-fps 60
exec-once = swaync

general {
    gaps_in = 8
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(39ff14ee) rgba(ff9e00ee) 45deg
    col.inactive_border = rgba(190e2c88)
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 0.90
    inactive_opacity = 0.86
    blur {
        enabled = true
        size = 8
        passes = 3
    }
}

animations {
    enabled = yes
}

$mainMod = SUPER
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod, Space, exec, rofi -show drun
bind = $mainMod, V, togglefloating,
bind = $mainMod, T, exec, kitsune-ctl theme next
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
