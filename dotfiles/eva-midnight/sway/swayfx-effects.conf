# ── Efectos Visuales Exclusivos de SwayFX (Idénticos al Preview Web) ─────────
corner_radius 12
smart_corner_radius off

blur enable
blur_xray disable
blur_passes 3
blur_radius 7
blur_noise 0.015
blur_brightness 0.96
blur_contrast 1.08
blur_saturation 1.18

shadows enable
shadows_on_csd enable
shadow_blur_radius 24
shadow_color #39ff1477
shadow_inactive_color #10081cAA

default_dim_inactive 0.08
dim_inactive_colors.unfocused #10081cAA
dim_inactive_colors.urgent #ff0055AA

# Cristal Blur en Barra Superior (Waybar), Dock Inferior (nwg-dock), Lanzador (Rofi) y SwayNC
layer_effects "waybar" "blur enable; shadows enable; corner_radius 12"
layer_effects "gtk-layer-shell" "blur enable; shadows enable; corner_radius 16"
layer_effects "rofi" "blur enable; shadows enable; corner_radius 12"
layer_effects "notifications" "blur enable; corner_radius 12"
