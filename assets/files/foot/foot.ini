# swaydesk · foot
# Paleta: {{THEME_NAME}}

[main]
font={{FONT}}:size={{TERM_FONT_SIZE}}
dpi-aware=yes
pad=12x14
app-id=foot
title=foot
selection-target=both
include=/etc/xdg/foot/foot.ini

[scrollback]
lines=10000
indicator-position=relative

[mouse]
hide-when-typing=yes

[cursor]
style=beam
blink=yes

[colors]
alpha=0.97
background={{THEME_BG_HEX}}
foreground={{THEME_FG_HEX}}
selection-background={{THEME_BG_SEL_HEX}}
selection-foreground={{THEME_FG_HEX}}
cursor={{THEME_ACCENT_HEX}} {{THEME_BG_HEX}}

# Normal
regular0={{THEME_BG_ALT_HEX}}
regular1={{THEME_ERR_HEX}}
regular2={{THEME_OK_HEX}}
regular3={{THEME_WARN_HEX}}
regular4={{THEME_ACCENT_HEX}}
regular5={{THEME_ACCENT2_HEX}}
regular6={{THEME_ACCENT_HEX}}
regular7={{THEME_FG_HEX}}

# Bright
bright0={{THEME_MUTED_HEX}}
bright1={{THEME_ERR_HEX}}
bright2={{THEME_OK_HEX}}
bright3={{THEME_WARN_HEX}}
bright4={{THEME_ACCENT_HEX}}
bright5={{THEME_ACCENT2_HEX}}
bright6={{THEME_ACCENT_HEX}}
bright7={{THEME_FG_HEX}}
