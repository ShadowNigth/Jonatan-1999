# swaydesk · foot
# Paleta: {{THEME_NAME}}

[main]
font={{FONT}}:size={{TERM_FONT_SIZE}}
dpi-aware=yes
pad=12x14
app-id=foot
title=foot
selection-target=both
include=/etc/xdg/foot/foot.ini

[scrollback]
lines=10000
indicator-position=relative

[mouse]
hide-when-typing=yes

[cursor]
style=beam
blink=yes

{{FOOT_COLORS_SECTION}}
# Translucidez: 1.0 = opaco, 0.5 = muy transparente (ver [effects] en config.toml)
alpha={{TERM_OPACITY}}
background={{THEME_BG_RGB}}
foreground={{THEME_FG_RGB}}
selection-background={{THEME_BG_SEL_RGB}}
selection-foreground={{THEME_FG_RGB}}
cursor={{THEME_ACCENT_RGB}} {{THEME_BG_RGB}}

# Normal
regular0={{THEME_BG_ALT_RGB}}
regular1={{THEME_ERR_RGB}}
regular2={{THEME_OK_RGB}}
regular3={{THEME_WARN_RGB}}
regular4={{THEME_ACCENT_RGB}}
regular5={{THEME_ACCENT2_RGB}}
regular6={{THEME_ACCENT_RGB}}
regular7={{THEME_FG_RGB}}

# Bright
bright0={{THEME_MUTED_RGB}}
bright1={{THEME_ERR_RGB}}
bright2={{THEME_OK_RGB}}
bright3={{THEME_WARN_RGB}}
bright4={{THEME_ACCENT_RGB}}
bright5={{THEME_ACCENT2_RGB}}
bright6={{THEME_ACCENT_RGB}}
bright7={{THEME_FG_RGB}}
