# swaydesk · overrides del usuario
#
# Este archivo se incluye al final de ~/.config/sway/config, así que sus
# directivas tienen prioridad. Ejemplos:
#
#   output HDMI-A-1 resolution 2560x1440@144Hz position 0,0 scale 1
#   output eDP-1 scale 1.25
#   input 1234:5678:My_Mouse accel_profile flat
#   bindsym XF86Favorites exec spotify
#   for_window [app_id="pavucontrol"] floating enable
#
# Recarga tras editar:  Super+Shift+c   (o `swaymsg reload`)
